name: af_finetune
channels:
  - pytorch
  - anaconda
  - conda-forge
  - https://USERNAME:PASSWORD@conda.graylab.jhu.edu
  - defaults

dependencies:
  # Python
  - python=3.9.13

  # CUDA toolkit for GPU support
  - cudatoolkit=11.6.0
  - cudnn=8.4.1.50

  # Deep learning frameworks
  - pytorch=1.12.1=py3.9_cuda11.6_cudnn8.3.2_0
  - pytorch-mutex=1.0=cuda
  - torchaudio=0.12.1=py39_cu116
  - torchvision=0.13.1=py39_cu116
  - tensorflow=2.10.0=cuda112py39h01bd6f0_0
  - tensorboard=2.10.1

  # JAX ecosystem
  - jax=0.3.23
  - jaxlib=0.3.22=cuda112py39h5d93514_200
  - dm-haiku=0.0.8
  - optax=0.1.3
  - chex=0.1.5

  # Core scientific packages
  - numpy=1.23.1
  - pandas=1.4.3
  - scipy=1.9.1
  - matplotlib=3.6.1
  - h5py=3.7.0

  # Utilities
  - tabulate=0.9.0

  # Pip packages
  - pip:
    - contextlib2==21.6.0
    - ml-collections==0.1.1
    - pyyaml==6.0
prefix: /wynton/home/kortemme/borr/miniconda3/envs/af_finetune
