[pytest]
# pytest configuration for lucs_af

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Enable strict markers (must be registered)
    --strict-markers
    # Coverage options (uncomment to enable)
    # --cov=common
    # --cov=degree_of_reshaping
    # --cov=alphafold_finetune
    # --cov-report=html
    # --cov-report=term-missing

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use PyRosetta, slower)
    slow: Slow tests (long-running calculations)
    requires_pyrosetta: Tests that require PyRosetta to be installed
    requires_gpu: Tests that require GPU/CUDA

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:biopandas
    ignore::DeprecationWarning:pyrosetta

# Minimum Python version
minversion = 3.9
