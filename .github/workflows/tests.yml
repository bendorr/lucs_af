name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Linux environment
        run: |
          echo "Running on: $(uname -s)"
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Test installation
        run: |
          python -c "import alphafold_finetune; import degree_of_reshaping; import helix_vectors; print('✓ All packages imported successfully')"

      - name: Run tests
        run: pytest tests/ -v

